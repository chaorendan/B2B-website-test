{%- comment -%} 首页「最新博文」条 —— 取最新 3 篇中文文章（英文版在 /en/，lang 过滤防重复） {%- endcomment -%}
{%- assign zh_posts = site.posts | where: "lang", "zh" -%}
{%- if zh_posts.size > 0 %}
<section class="latest-posts">
  <div class="section-title">最新博文</div>
  <div class="post-grid">
    {%- for post in zh_posts limit:3 %}
      {% include post-card.html post=post %}
    {%- endfor %}
  </div>
  <p class="latest-posts__more">
    <a href="{{ '/blog/' | relative_url }}">查看全部博文 &rarr;</a>
  </p>
</section>
{%- endif %}
