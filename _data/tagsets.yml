# 标签图谱 —— 关系簇（开放标签的聚类展示层）
#
# 三条护栏（每次新增簇/标签前自查，防止再长出"剩余范畴"）：
#   1. 问句测试：一个簇必须能被一个疑问句命名（下面 question 字段），否则太宽。
#   2. 份额测试：单簇文章数不超过中文总量的 40%，超了就拆。
#   3. 镜像测试：簇名不得与某个分类（_data/categories.yml）同义。
#
# 与分类的职责划分：
#   categories = 固定的主题抽屉，少而互斥；
#   关系簇     = 可重叠的观察视角，同一篇文章允许同时活在几簇里。
#
# 字段：key / title / question（对外显示的判据）/ desc / tags
#       layers（可选）：簇内再分层，每层有 title 与 tags；页面按 h3 分组渲染。
