# 每日一言 —— 唯一事实来源（首页组件、/quotes/ 归档页都读这里）
#
# 规则：
#   1. cycle 冻结为 60。前 60 条的顺序 = 轮播顺序，新增条目一律追加到末尾，
#      不得插入或重排，否则所有历史日期对应的一言都会错位。
#   2. 新增请写 date: "YYYY-MM-DD"（该日定点，优先于轮播）。
#   3. 不写 date 的条目只参与轮播（dayNumber % cycle）。
#   4. 字段：zh / en / fr（三语必填）、date（选填）、theme（选填，预留）。
cycle: 60
items:
  - zh: "爱是没有卑微可言的。"
    en: "There is nothing base about love."
    fr: "Il n'y a rien de bas dans l'amour."
  - zh: "错误的方法，远比错误的结论致命得多。"
    en: "A wrong method is far more lethal than a wrong conclusion."
    fr: "Une méthode erronée est bien plus meurtrière qu'une conclusion erronée."
  - zh: "最能带来开心的，恰恰是把自己明知必要但不喜欢做的事做成了。"
    en: "The greatest joy comes precisely from finishing what you knew was necessary but did not enjoy."
    fr: "La plus grande joie vient précisément d'avoir achevé ce que l'on savait nécessaire mais que l'on n'aimait pas faire."
  - zh: "淡定和坦然本身就可以解决大部分问题。"
    en: "Calm and composure alone can solve most problems."
    fr: "Le calme et la sérénité suffisent à eux seuls à résoudre la plupart des problèmes."
  - zh: "世事无常，你可以有常。"
    en: "The world is ever-changing; you can be constant."
    fr: "Le monde est inconstant ; toi, tu peux être constant."
  - zh: "独立意味着生活独立，情感独立和精神独立。"
    en: "Independence means independence in life, in emotion, and in spirit."
    fr: "L'indépendance, c'est l'indépendance dans la vie, dans les émotions et dans l'esprit."
  - zh: "人的共识并非真理的标准。"
    en: "Consensus is not the measure of truth."
    fr: "Le consensus n'est pas la mesure de la vérité."
  - zh: "人会活成自己相信的样子，所以要自我激励，但不要自我欺骗。"
    en: "We become what we believe ourselves to be — so motivate yourself, but never deceive yourself."
    fr: "On devient ce que l'on croit être — alors motive-toi, mais ne te mens jamais."
  - zh: "世上唯一的狂妄是否定事实。"
    en: "The only arrogance in the world is denying the facts."
    fr: "La seule arrogance au monde est de nier les faits."
  - zh: "不必坐而论道，何如起而行之。"
    en: "Rather than sit and theorize, why not rise and act?"
    fr: "Plutôt que de deviser assis, pourquoi ne pas se lever et agir ?"
  - zh: "爱胜于情，爱是永不止息。"
    en: "Love surpasses feeling; love never fails."
    fr: "L'amour surpasse le sentiment ; l'amour ne passe jamais."
  - zh: "情绪稳定的本质在于掌控欲和掌控力的比值。"
    en: "Emotional stability is, at bottom, the ratio of the desire to control to the power to control."
    fr: "La stabilité émotionnelle tient au rapport entre le désir de contrôle et le pouvoir de contrôler."
  - zh: "不能让你痛苦的东西，没有资格让你快乐。"
    en: "What cannot make you suffer has no right to make you happy."
    fr: "Ce qui ne peut pas te faire souffrir n'a pas le droit de te rendre heureux."
  - zh: "人生惟尽义、尽力而已，其它要看天命，不必执着。"
    en: "In life one only does one's duty and one's utmost; the rest is up to fate — do not cling to it."
    fr: "Dans la vie, on n'a qu'à faire son devoir et de son mieux ; le reste dépend du destin — sans s'y attacher."
  - zh: "人需要拥有的最重要的核心能力，就是无歧义、完备、简洁的表达能力。"
    en: "The most important core ability one can have is to express oneself unambiguously, completely, and concisely."
    fr: "La capacité essentielle la plus importante est de s'exprimer sans ambiguïté, pleinement et avec concision."
  - zh: "人是从谦卑开始变强的。"
    en: "One grows strong starting from humility."
    fr: "C'est à partir de l'humilité que l'on devient fort."
  - zh: "尊重是一种政策，是你这个一人之国的法律。"
    en: "Respect is a policy — the law of your one-person nation."
    fr: "Le respect est une politique — la loi de ta nation d'une seule personne."
  - zh: "会等的人可以看到很多奇迹。"
    en: "Those who can wait will see many miracles."
    fr: "Qui sait attendre verra bien des miracles."
  - zh: "礼貌是自己对自己的尊重。"
    en: "Politeness is the respect you owe yourself."
    fr: "La politesse est le respect que l'on se doit à soi-même."
  - zh: "凡事要讲道理，少讲情绪。"
    en: "In all things, appeal to reason; speak of emotion sparingly."
    fr: "En toute chose, raisonne ; parle peu d'émotion."
  - zh: "做你当做的事，尽你当尽的义。"
    en: "Do what you ought to do; fulfill the duty that is yours."
    fr: "Fais ce que tu dois faire ; accomplis le devoir qui t'incombe."
  - zh: "说话做事要确切、踏实、具体，不要用诗性的语言讨论实践操作的事。"
    en: "Speak and act precisely, solidly, concretely; never discuss practical matters in poetic language."
    fr: "Parle et agis avec précision, solidité et concrétude ; ne discute jamais de choses pratiques en langage poétique."
  - zh: "独立思考背后的根基其实是独立生存，独立负责。"
    en: "The true foundation of independent thinking is independent survival and independent responsibility."
    fr: "Le véritable fondement de la pensée indépendante est la survie indépendante et la responsabilité indépendante."
  - zh: "真正永远不错的，是万变。"
    en: "The one thing never wrong is change itself."
    fr: "Ce qui ne se trompe jamais, c'est le changement même."
  - zh: "够强的人能认输。"
    en: "Only the strong can concede defeat."
    fr: "Seul le fort peut admettre sa défaite."
  - zh: "能力感的关键在于扎实，其次才是基于扎实的广博。"
    en: "The key to a sense of competence is solidity; breadth built on that solidity comes second."
    fr: "La clé du sentiment de compétence, c'est la solidité ; l'étendue bâtie sur elle vient ensuite."
  - zh: "把人生中维持性的事务构建成习惯，把进取性的价值追求构建成瘾。"
    en: "Turn everything sustaining in life into habit; turn every aspirational pursuit of value into addiction."
    fr: "Fais de tout ce qui entretient la vie une habitude ; fais de toute quête de valeur une addiction."
  - zh: "踏实就是冗余、备份和信仰。"
    en: "Being dependable is redundancy, backup, and faith."
    fr: "La fiabilité, c'est la redondance, la sauvegarde et la foi."
  - zh: "勇气的根基是高度的理性。"
    en: "The foundation of courage is a high degree of rationality."
    fr: "Le fondement du courage est un haut degré de rationalité."
  - zh: "行善不丧志。"
    en: "Do good, and do not lose heart."
    fr: "Fais le bien sans te décourager."
  - zh: "祈祷是你爱一个人时唯一可行的请求方式。"
    en: "Prayer is the only viable way to make a request of someone you love."
    fr: "La prière est la seule manière viable de demander quelque chose à celui que l'on aime."
  - zh: "你的内心戏不算数。"
    en: "Your inner drama does not count."
    fr: "Ton théâtre intérieur ne compte pas."
  - zh: "人生不是赛跑，而是旅游。"
    en: "Life is not a race; it is a journey."
    fr: "La vie n'est pas une course, c'est un voyage."
  - zh: "在历史面前，快乐是你待完成的义务，不是你可索取的权利。"
    en: "Before history, joy is a duty to fulfill, not a right to claim."
    fr: "Face à l'histoire, la joie est un devoir à accomplir, non un droit à revendiquer."
  - zh: "服从和接受客观世界的既定事实，不是软弱，而是谦卑。"
    en: "To accept and submit to the given facts of the objective world is not weakness but humility."
    fr: "Accepter et se soumettre aux faits établis du monde objectif n'est pas faiblesse, mais humilité."
  - zh: "不管是什么日子，都要有知觉、有自省、有目的地度过。"
    en: "Whatever the day may be, live it with awareness, self-reflection, and purpose."
    fr: "Quel que soit le jour, vis-le avec lucidité, introspection et dessein."
  - zh: "只存在乐观的技巧问题，不存在不可乐观的问题。"
    en: "There are only questions of the technique of optimism; there is no problem beyond hope."
    fr: "Il n'existe que des questions de technique de l'optimisme ; aucun problème n'est sans espoir."
  - zh: "真正绝对必须的其实是反脆弱。"
    en: "What is truly indispensable is, in fact, antifragility."
    fr: "Ce qui est vraiment indispensable, c'est en fait l'antifragilité."
  - zh: "人自身有避免无知的义务。"
    en: "Every person has a duty to avoid ignorance."
    fr: "Chacun a le devoir d'éviter l'ignorance."
  - zh: "一切遭遇都有意义。"
    en: "Every experience has meaning."
    fr: "Toute épreuve a un sens."
  - zh: "永远都不要为那些不可控的事耗费心力，永远都要为可控的事尽心尽力。"
    en: "Never spend your energy on what you cannot control; always give your all to what you can."
    fr: "Ne gaspille jamais ton énergie pour ce qui échappe à ton contrôle ; donne toujours ton maximum à ce que tu peux maîtriser."
  - zh: "接纳自己，指的是以你的主体性接纳你的客体性。"
    en: "To accept yourself is to accept your objectivity through your subjectivity."
    fr: "S'accepter, c'est accueillir son objectivité par sa subjectivité."
  - zh: "不要怯于用真正完善的伦理法则自我审视。"
    en: "Do not be afraid to examine yourself by truly complete ethical principles."
    fr: "Ne crains pas de t'examiner selon des principes éthiques vraiment aboutis."
  - zh: "所有可以被消除的痛苦都应该被消除。"
    en: "All suffering that can be eliminated should be eliminated."
    fr: "Toute souffrance qui peut être éliminée doit l'être."
  - zh: "没有原谅，就没有救赎。"
    en: "Without forgiveness, there is no redemption."
    fr: "Sans pardon, il n'y a pas de rédemption."
  - zh: "不包含任何行动的愿望是无意义的，说出来只构成对自己的欺骗。"
    en: "A wish that contains no action is meaningless; spoken aloud, it is only self-deception."
    fr: "Un souhait sans action est vide de sens ; dit à voix haute, il n'est qu'une duperie envers soi-même."
  - zh: "努力是一种天定的义务。"
    en: "Effort is a heaven-ordained duty."
    fr: "L'effort est un devoir prescrit par le ciel."
  - zh: "模糊意味着可能，这不仅仅包含坏的可能，同样包含好的可能。"
    en: "Ambiguity means possibility — not only the possibility of bad, but equally that of good."
    fr: "L'ambiguïté, c'est le possible — non seulement le mauvais possible, mais tout autant le bon."
  - zh: "在不理解的时候学习谦卑，在不被理解的时候学习原谅。"
    en: "Learn humility when you do not understand, and forgiveness when you are not understood."
    fr: "Apprends l'humilité quand tu ne comprends pas, et le pardon quand on ne te comprend pas."
  - zh: "人没有资格凭着自己的智慧就绝望。"
    en: "No one has the right to despair on the strength of their own wisdom."
    fr: "Nul n'a le droit de désespérer au nom de sa propre sagesse."
  - zh: "不怕肯定别人，不惜否定自己。"
    en: "Do not fear affirming others; do not spare yourself from self-denial."
    fr: "Ne crains pas d'affirmer les autres ; ne t'épargne pas de te renier toi-même."
  - zh: "一个人决不能给事实定冒犯的罪。"
    en: "One must never convict a fact of the crime of giving offense."
    fr: "On ne doit jamais condamner un fait pour le crime d'avoir offensé."
  - zh: "爱，不思恶。"
    en: "Love thinks no evil."
    fr: "L'amour ne pense pas le mal."
  - zh: "不要焦虑，不要沮丧，在这游戏中坚持下去。"
    en: "Do not be anxious, do not be discouraged; hold on in this game."
    fr: "Ne sois ni anxieux ni abattu ; tiens bon dans ce jeu."
  - zh: "既然命中注定有洪水，那就索性把游泳和冲浪学好。"
    en: "If a flood is destined, then simply learn to swim and to surf well."
    fr: "Puisqu'un déluge est inévitable, autant apprendre à bien nager et à surfer."
  - zh: "当失败不可能真正伤害到你时，失败就失去了一切真实的威力。"
    en: "When failure can no longer truly harm you, it loses all its real power."
    fr: "Quand l'échec ne peut plus vraiment te nuire, il perd toute sa puissance réelle."
  - zh: "问题不在于这个选择，而在于能不能承受住自己的选择。"
    en: "The question is not the choice, but whether you can bear your own choice."
    fr: "La question n'est pas le choix, mais de savoir si tu peux assumer ton choix."
  - zh: "如果你要恨，你总能找到足够的理由；如果你要爱，你总能找到足够的勇气。"
    en: "If you would hate, you will always find reason enough; if you would love, you will always find courage enough."
    fr: "Si tu veux haïr, tu trouveras toujours assez de raisons ; si tu veux aimer, tu trouveras toujours assez de courage."
  - zh: "人生最好的样式就是向死而生。"
    en: "The best way to live is to live toward death."
    fr: "La meilleure façon de vivre est de vivre vers la mort."
  - zh: "改变现实是从接受现实开始的。"
    en: "Changing reality begins with accepting reality."
    fr: "Changer la réalité commence par accepter la réalité."
