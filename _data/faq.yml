# 页脚常见问题 · 唯一数据源
#
# ⚠️ _data 下的文件不会被 Liquid 处理（与 front matter 的规则一致）。
#    所以这里不能写 Liquid 输出标签（双花括号 / 百分号花括号都不行），
#    需要动态取值的地方（如联系邮箱）在 _includes/faq.html 模板侧拼接。
#
# 使用规则：
#   - 只放「站点级」问题（你是谁 / 能不能合作 / 内容可信度 / 版权）
#   - 主题级问题（如"否定关键词怎么设"）留在对应知识库文章里，不要两处重复
#   - 条目达到 10 条、或一个月内被 3 个以上不同来源触发 → 升级为独立 /faq/ 页
#     届时复用本文件，页脚只保留一个入口链接

title: "常见问题"

items:
  - q: "你是谁？现在在做什么？"
    a: "我是彭俊超（chaorendan），长江大学地理信息科学专业在读。方向是把 GIS 的空间分析能力接到数字营销上——地理定向投放、地图可视化，以及 SEO / GEO（地理搜索优化）。"

  - q: "这个网站上的内容是什么？"
    a: "两条主线。一是「知识库」：沉淀可复用的数字营销方法，目前有 Google Ads 十个板块与 GEO 地理定向。二是「项目与案例」：记录我自己从零做完的完整链路，包含真实数据与踩过的坑。"

  - q: "可以合作吗？怎么联系你？"
    a: "可以。目前接受 GIS 空间分析、SEO / GEO 方向的项目讨论、内容合作与实习机会。说明来意即可，我一般 1–2 天内回复。"
    contact: true

  - q: "这些内容的可信度怎么判断？"
    a: "知识库内容是我自己实践后、与官方文档核对过的整理；案例里的数据都标注了验证方式（命令行输出、接口返回或后台记录）。凡是我没有验证过的，会明确写「未验证」，不做推断式结论。"

  - q: "内容可以转载吗？"
    a: "欢迎注明出处后转载，请保留原文链接与署名。用于商业用途，或整站抓取式搬运，请先邮件沟通。"
