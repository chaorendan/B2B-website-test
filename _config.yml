# Site settings
title: "超人蛋 · 彭俊超"
description: "GIS 空间分析 × 数字营销 × SEO —— 彭俊超的个人主页与增长知识库"
email: "pengjunchao.ads@gmail.com"
url: "https://chaorendan.top"
baseurl: ""
theme: minima
locale: zh-CN
timezone: Asia/Shanghai

# Google Tag Manager
gtm_container_id: "GTM-M2XCSSGJ"

header_pages:
  - blog/index.md
  - kb/index.md
  - projects.md
  - about.md

collections:
  knowledge:
    output: true
    permalink: /kb/:path/
  projects:
    output: true
    permalink: /projects/:path/
  fr:
    output: true
  geo:
    output: true
    permalink: /geo/:path/

defaults:
  # ---------------------------------------------------------------------------
  # 博客文章（_posts/）数据结构 —— 唯一事实来源
  # ---------------------------------------------------------------------------
  # 必填：
  #   title        文章标题（中文写这里，不要写进文件名）
  #   date         发布日期，格式 YYYY-MM-DD HH:MM:SS +0800
  #   description  一句话摘要（列表卡片、og:description 都用它）
  # 选填：
  #   cover         封面图路径，如 /assets/images/blog/xxx.jpg（相对站点根）
  #                 不填 = 无封面，列表自动降级为「文字优先卡片」，详情页不显示图
  #   cover_alt     封面替代文本（无障碍 + SEO）；不填则回落到文章标题
  #   cover_caption 封面图注（可选，显示在封面下方）
  #   tags          标签数组，如 [SEO, 独立站]；卡片上最多显示 3 个
  #   categories    分类（暂不做分类归档页，仅作数据保留）
  #   author        默认 彭俊超
  #   published     false = 不发布（不进 site.posts、不进 sitemap）
  #   lang          默认 zh
  # 约束：
  #   1. 文件名必须是 ASCII 英文（Jekyll slugify 会把中文压成空 slug）
  #   2. front matter 是纯 YAML，禁止出现 {{ }} 或 {% %}（会导致整块被丢弃）
  #   3. 正文用 Markdown，Liquid 标签只在模板里写
  # 路由：列表 /blog/  ·  详情 /blog/:title/（文件名去掉日期部分即 slug）
  # ---------------------------------------------------------------------------
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: "/blog/:title/"
      author: "彭俊超"
      published: true
      lang: "zh"
  - scope:
      path: "_knowledge"
      type: "knowledge"
    values:
      layout: "page"
      author: "彭俊超"
      published: true
      lang: "zh"
  - scope:
      path: "_projects"
      type: "projects"
    values:
      layout: "page"
      author: "彭俊超"
      published: true
      lang: "zh"
  - scope:
      path: "_fr"
      type: "fr"
    values:
      layout: "page"
      author: "彭俊超"
      published: true
      lang: "fr"
  - scope:
      path: "_geo"
      type: "geo"
    values:
      layout: "page"
      author: "彭俊超"
      published: true
      lang: "zh"

# Multi-language settings
languages:
  - code: "en"
    name: "English"
    default: true
  - code: "fr"
    name: "French"
    url_prefix: "/fr/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - "*.backup"
  - "*.new"
  - _ARCHITECTURE_DESIGN.md
  - _TEMPLATE.md
  - growth-lab/
