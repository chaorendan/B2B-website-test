# Site settings
title: "超人蛋 · 彭俊超"
description: "GIS 空间分析 × 数字营销 × SEO —— 彭俊超的个人主页与增长知识库"
email: "pengjunchao.ads@gmail.com"
url: "https://chaorendan.top"
baseurl: ""
theme: minima
locale: zh-CN
timezone: Asia/Shanghai

# Google Tag Manager
gtm_container_id: "GTM-M2XCSSGJ"

header_pages:
  - blog/index.md
  - kb/index.md
  - projects.md
  - about.md

collections:
  knowledge:
    output: true
    permalink: /kb/:path/
  projects:
    output: true
    permalink: /projects/:path/
  fr:
    output: true
  geo:
    output: true
    permalink: /geo/:path/

defaults:
  # 博客文章（_posts/）：文件名必须是 ASCII 英文，标题写在 title 里
  # 原因：Jekyll 默认 slugify 只保留 ASCII，中文文件名会被压成空 slug 导致 URL 异常
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: "/blog/:title/"
      author: "彭俊超"
      published: true
      lang: "zh"
  - scope:
      path: "_knowledge"
      type: "knowledge"
    values:
      layout: "page"
      author: "彭俊超"
      published: true
      lang: "zh"
  - scope:
      path: "_projects"
      type: "projects"
    values:
      layout: "page"
      author: "彭俊超"
      published: true
      lang: "zh"
  - scope:
      path: "_fr"
      type: "fr"
    values:
      layout: "page"
      author: "彭俊超"
      published: true
      lang: "fr"
  - scope:
      path: "_geo"
      type: "geo"
    values:
      layout: "page"
      author: "彭俊超"
      published: true
      lang: "zh"

# Multi-language settings
languages:
  - code: "en"
    name: "English"
    default: true
  - code: "fr"
    name: "French"
    url_prefix: "/fr/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - "*.backup"
  - "*.new"
  - _ARCHITECTURE_DESIGN.md
  - _TEMPLATE.md
  - growth-lab/
